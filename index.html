<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ឧបករណ៍វាយតម្លៃព័ត៌មាន និងរូបភាព</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-4 max-w-2xl">
        <header class="bg-blue-600 text-white p-6 rounded-t-lg text-center">
            <h1 class="text-2xl font-bold">ឧបករណ៍បង្រៀន៖ ការពិត vs ព័ត៌មានក្លែងក្លាយ</h1>
            <p>ជួយសិស្សឱ្យចេះបែងចែកព័ត៌មាន និងរូបភាព AI</p>
        </header>
        
        <main class="bg-white p-6 rounded-b-lg shadow-md">
            <!-- ផ្នែកវិភាគព័ត៌មាន -->
            <section class="mb-8">
                <h2 class="text-lg font-semibold mb-2">ពិនិត្យភាពត្រឹមត្រូវនៃព័ត៌មាន</h2>
                <input type="text" id="newsInput" placeholder="បញ្ចូលចំណងជើងព័ត៌មាន..." class="w-full p-2 border rounded mb-2">
                <button onclick="checkNews()" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">វិភាគព័ត៌មាន</button>
                <div id="newsResult" class="mt-4 p-4 bg-gray-50 rounded hidden"></div>
            </section>

            <!-- ផ្នែកវិភាគរូបភាព -->
            <section>
                <h2 class="text-lg font-semibold mb-2">វិភាគរូបភាព (AI ឬ ពិត)</h2>
                <div class="border-2 border-dashed p-6 text-center cursor-pointer hover:bg-gray-50">
                    <p>ទាញរូបភាពមកដាក់ទីនេះ ឬចុចដើម្បីជ្រើសរើស</p>
                    <input type="file" id="imageInput" class="hidden">
                </div>
                <button onclick="checkImage()" class="w-full mt-2 bg-green-500 text-white py-2 rounded hover:bg-green-600">ពិនិត្យរូបភាព</button>
                <div id="imageResult" class="mt-4 p-4 bg-gray-50 rounded hidden"></div>
            </section>
        </main>
    </div>

    <script>
        function checkNews() {
            const resultDiv = document.getElementById('newsResult');
            resultDiv.classList.remove('hidden');
            resultDiv.innerHTML = `<p class="text-yellow-600 font-bold">កំពុងវិភាគ... យោងតាមលក្ខណៈវិនិច្ឆ័យ៖ តើព័ត៌មាននេះមានប្រភពច្បាស់លាស់ដែរឬទេ? តើគេហទំព័រគួរឱ្យទុកចិត្តដែរឬទេ?</p>`;
        }

        function checkImage() {
            const resultDiv = document.getElementById('imageResult');
            resultDiv.classList.remove('hidden');
            resultDiv.innerHTML = `<p class="text-purple-600 font-bold">កំពុងស្វែងរកលក្ខណៈពិសេសរបស់ AI៖ ពិនិត្យភាពមិនប្រក្រតីនៃម្រាមដៃ ផ្ទៃខាងក្រោយ ឬពន្លឺខុសធម្មតា។</p>`;
        }
    </script>
</body>
</html>
