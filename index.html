<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធវិភាគព័ត៌មាន និងរូបភាពឌីជីថល</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Moul&display=swap');
        body { font-family: 'Battambang', sans-serif; background-color: #f1f5f9; }
        .title-font { font-family: 'Moul', serif; }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col justify-between">

    <header class="bg-gradient-to-r from-slate-900 via-blue-900 to-slate-900 text-white shadow-xl py-6 border-b-4 border-blue-500 relative">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-2xl md:text-3xl title-font text-yellow-400">មន្ទីរពិសោធន៍វិភាគព័ត៌មាន AI</h1>
        </div>
        <button onclick="alert('ការកំណត់៖ API Key កំពុងដំណើរការដោយ AIzaSyCdS...')" class="absolute top-6 right-8 text-white hover:text-yellow-400 text-2xl"><i class="fas fa-cog"></i></button>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-4xl flex-grow">
        <div class="flex border-b border-gray-300 mb-6 bg-white rounded-t-xl shadow-md">
            <button onclick="switchTab('text')" id="tab-text" class="flex-1 py-4 font-bold text-blue-600 border-b-4 border-blue-600">វិភាគអត្ថបទ</button>
            <button onclick="switchTab('image')" id="tab-image" class="flex-1 py-4 font-bold text-gray-500 border-b-4 border-transparent">ស៊ើបអង្កេតរូបភាព</button>
        </div>

        <div id="section-text" class="space-y-6">
            <textarea id="newsInput" rows="7" class="w-full p-4 border rounded-lg" placeholder="បញ្ចូលអត្ថបទនៅទីនេះ..."></textarea>
            <button onclick="advancedScanText()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700">ដំណើរការវិភាគ</button>
            <div id="forensicReport" class="hidden p-6 bg-white border rounded-xl shadow-sm">
                <h4 class="font-bold text-lg mb-2 text-blue-900">លទ្ធផលវិភាគ៖</h4>
                <div id="diagnosisDetails" class="text-gray-700"></div>
            </div>
        </div>

        <div id="section-image" class="hidden space-y-6">
            <input type="file" id="imageLoader" class="hidden" onchange="handleImageSelection(event)">
            <div class="border-2 border-dashed rounded-lg p-6 text-center cursor-pointer hover:border-blue-400" onclick="document.getElementById('imageLoader').click()">
                <p class="text-gray-600">ចុចទីនេះដើម្បីបង្ហោះរូបភាព</p>
                <img id="localImgPreview" class="hidden mx-auto mt-4 max-h-64 rounded">
            </div>
            <button onclick="startImageScanning()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700">ឱ្យ AI ស្កេនរូបភាព</button>
            <div id="imageResult" class="hidden p-6 bg-white border rounded-xl shadow-sm text-gray-700"></div>
        </div>
    </main>

    <script>
        const GLOBAL_API_KEY = "AIzaSyCdS-sveuqN9gmlzWUrbdpfhnIcVp2QoQc";
        
        function switchTab(tab) {
            document.getElementById('section-text').classList.toggle('hidden', tab !== 'text');
            document.getElementById('section-image').classList.toggle('hidden', tab !== 'image');
            document.getElementById('tab-text').classList.toggle('border-blue-600', tab === 'text');
            document.getElementById('tab-image').classList.toggle('border-blue-600', tab === 'image');
        }

        function handleImageSelection(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = document.getElementById('localImgPreview');
                img.src = event.target.result;
                img.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        async function advancedScanText() {
            const text = document.getElementById('newsInput').value;
            if (!text) return alert("សូមបញ្ចូលអត្ថបទ!");
            
            const display = document.getElementById('diagnosisDetails');
            display.innerText = "កំពុងវិភាគ... សូមរង់ចាំបន្តិច...";
            document.getElementById('forensicReport').classList.remove('hidden');
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${GLOBAL_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "វិភាគអត្ថបទនេះជាភាសាខ្មែរថាពិតឬមិនពិត៖ " + text }] }] })
                });
                const data = await response.json();
                display.innerText = data.candidates[0].content.parts[0].text;
            } catch (err) {
                display.innerText = "មានបញ្ហា៖ មិនអាចភ្ជាប់ទៅកាន់ AI បានទេ។ សូមពិនិត្យអ៊ីនធឺណិត។";
            }
        }

        async function startImageScanning() {
            alert("មុខងារវិភាគរូបភាពកំពុងដំណើរការ...");
        }
    </script>
</body>
</html>
