<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធត្រួតពិនិត្យព័ត៌មាន និងរូបភាព</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-blue-800 mb-2 text-center">ប្រព័ន្ធបែងចែកព័ត៌មាន និងរូបភាព AI</h1>
        <p class="text-center text-gray-600 mb-6 text-sm">ឧបករណ៍សម្រាប់អប់រំសិស្សក្នុងការវិភាគព័ត៌មានឌីជីថល</p>
        
        <!-- Tab Navigation -->
        <div class="flex border-b mb-6">
            <button onclick="showTab('news')" class="flex-1 py-2 font-bold text-blue-600 border-b-2 border-blue-600" id="tab-news">ត្រួតពិនិត្យព័ត៌មាន</button>
            <button onclick="showTab('image')" class="flex-1 py-2 font-bold text-gray-500" id="tab-image">ត្រួតពិនិត្យរូបភាព</button>
        </div>

        <!-- News Section -->
        <div id="news-section">
            <textarea id="news-input" class="w-full h-32 p-4 border rounded-lg mb-4" placeholder="ចម្លងខ្លឹមសារព័ត៌មានមកទីនេះ..."></textarea>
            <button onclick="checkNews()" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700">វិភាគព័ត៌មាន</button>
            <div id="news-result" class="mt-6 p-4 rounded-lg hidden"></div>
        </div>

        <!-- Image Section -->
        <div id="image-section" class="hidden">
            <input type="file" id="image-input" class="w-full p-4 border rounded-lg mb-4">
            <button onclick="checkImage()" class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700">វិភាគរូបភាព</button>
            <div id="image-result" class="mt-6 p-4 rounded-lg hidden"></div>
        </div>
    </div>

    <script>
        function showTab(tab) {
            document.getElementById('news-section').classList.toggle('hidden', tab !== 'news');
            document.getElementById('image-section').classList.toggle('hidden', tab !== 'image');
            document.getElementById('tab-news').className = tab === 'news' ? 'flex-1 py-2 font-bold text-blue-600 border-b-2 border-blue-600' : 'flex-1 py-2 font-bold text-gray-500';
            document.getElementById('tab-image').className = tab === 'image' ? 'flex-1 py-2 font-bold text-blue-600 border-b-2 border-blue-600' : 'flex-1 py-2 font-bold text-gray-500';
        }

        function checkNews() {
            const input = document.getElementById('news-input').value;
            const resultDiv = document.getElementById('news-result');
            resultDiv.classList.remove('hidden');
            
            if (input.length < 20) {
                resultDiv.className = "mt-6 p-4 rounded-lg bg-yellow-100 text-yellow-800";
                resultDiv.innerHTML = "<strong>សូមអភ័យទោស៖</strong> សូមបញ្ចូលខ្លឹមសារឱ្យបានគ្រប់គ្រាន់។ លោកគ្រូអាចណែនាំសិស្សឱ្យពិនិត្យ៖ ១. ប្រភពព័ត៌មាន, ២. កាលបរិច្ឆេទ, និង ៣. ពិនិត្យមើលគេហទំព័រផ្លូវការផ្សេងទៀត។";
                return;
            }

            resultDiv.className = "mt-6 p-4 rounded-lg bg-blue-50 border border-blue-200 text-blue-900";
            resultDiv.innerHTML = `
                <h3 class="font-bold mb-2">លទ្ធផលវិភាគបឋម៖</h3>
                <p class="text-sm mb-3">ប្រព័ន្ធកំពុងដំណើរការវិភាគតាមគំរូសាកល្បង។ សូមចងចាំថា៖</p>
                <div class="space-y-2">
                    <div class="bg-white p-3 rounded border border-blue-300">
                        <p class="font-bold text-blue-700 text-sm">គន្លឹះសំខាន់សម្រាប់សិស្ស៖</p>
                        <ul class="list-disc ml-5 text-sm mt-1 space-y-1 text-gray-700">
                            <li><strong>ប្រភព៖</strong> តើព័ត៌មាននេះមកពីស្ថាប័នផ្លូវការ ឬប្រភពដែលគួរឱ្យទុកចិត្តដែរឬទេ?</li>
                            <li><strong>ភាពស្របគ្នា៖</strong> តើបណ្ដាញព័ត៌មានធំៗដទៃទៀតចុះផ្សាយដូចគ្នានេះដែរឬទេ?</li>
                            <li><strong>ចេតនា៖</strong> តើព័ត៌មាននេះបង្កើតឡើងដើម្បីបង្កឱ្យមានការភ័យខ្លាច ឬបែងចែកសង្គមដែរឬទេ?</li>
                        </ul>
                    </div>
                    <p class="text-xs text-gray-500 italic mt-2">*សម្គាល់៖ ការវិភាគនេះជាការណែនាំបឋម សូមពិនិត្យជាមួយប្រភពព័ត៌មានពិតប្រាកដជានិច្ច។</p>
                </div>
            `;
        }

        function checkImage() {
            const resultDiv = document.getElementById('image-result');
            resultDiv.classList.remove('hidden');
            resultDiv.className = "mt-6 p-4 rounded-lg bg-purple-50 border border-purple-200 text-purple-900";
            resultDiv.innerHTML = `
                <h3 class="font-bold mb-2">ការវិភាគរូបភាព៖</h3>
                <p class="text-sm mb-3">សម្រាប់ការត្រួតពិនិត្យរូបភាពដែលបង្កើតដោយ AI សូមណែនាំសិស្សឱ្យពិនិត្យចំណុចទាំងនេះ៖</p>
                <ul class="list-disc ml-5 text-sm text-gray-700 space-y-1">
                    <li><strong>ម្រាមដៃ និងសន្លាក់៖</strong> AI ច្រើនតែមានកំហុសក្នុងការបង្កើតម្រាមដៃឱ្យមានភាពដូចធម្មជាតិ។</li>
                    <li><strong>ផ្ទៃខាងក្រោយ និងពន្លឺ៖</strong> ពិនិត្យមើលថា តើស្រមោល និងពន្លឺមានភាពស្របគ្នានឹងវត្ថុក្នុងរូបភាពដែរឬទេ។</li>
                    <li><strong>ភាពមិនប្រក្រតី៖</strong> ពិនិត្យរកមើលចំណុចដែលមើលទៅ "ព្រិលៗ" ឬមិនស៊ីសង្វាក់គ្នានៅតាមគែមវត្ថុ។</li>
                </ul>
            `;
        }
    </script>
</body>
</html>
