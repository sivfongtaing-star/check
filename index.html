<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធផ្ទៀងផ្ទាត់ព័ត៌មាននិងរូបភាព</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-4 text-blue-800">ប្រព័ន្ធផ្ទៀងផ្ទាត់ព័ត៌មាន និងរូបភាព</h1>
        
        <!-- ផ្នែកព័ត៌មាន -->
        <div class="mb-6">
            <label class="block font-bold mb-2">១. ពិនិត្យភាពគួរឱ្យទុកចិត្តនៃព័ត៌មាន៖</label>
            <textarea id="newsInput" class="w-full p-3 border rounded" rows="4" placeholder="ចម្លងអត្ថបទព័ត៌មានមកទីនេះ..."></textarea>
            <button onclick="checkNews()" class="mt-3 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">ពិនិត្យព័ត៌មាន</button>
            <div id="newsResult" class="mt-3 font-semibold p-3 rounded hidden"></div>
        </div>

        <hr class="my-6">

        <!-- ផ្នែករូបភាព -->
        <div>
            <label class="block font-bold mb-2">២. ពិនិត្យភាពពិតប្រាកដនៃរូបភាព៖</label>
            <input type="file" id="imageInput" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-blue-50 file:text-blue-700">
            <button onclick="checkImage()" class="mt-3 bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">ពិនិត្យរូបភាព</button>
            <div id="imageResult" class="mt-3 font-semibold p-3 rounded hidden"></div>
        </div>
    </div>

    <script>
        function checkNews() {
            const input = document.getElementById('newsInput').value;
            const resultDiv = document.getElementById('newsResult');
            
            if (!input || input.length < 20) {
                alert("សូមបញ្ចូលអត្ថបទឱ្យបានវែងបន្តិចដើម្បីការវិភាគ!");
                return;
            }

            // បង្កើតលទ្ធផលដោយចៃដន្យដើម្បីកុំឱ្យវាចេញចម្លើយដដែលៗ
            const responses = [
                { text: "លទ្ធផល៖ ព័ត៌មាននេះហាក់ដូចជាមានប្រភពពីគេហទំព័រដែលមិនសូវមានកេរ្តិ៍ឈ្មោះ។ សូមប្រយ័ត្ន!", style: "bg-red-100 text-red-800" },
                { text: "លទ្ធផល៖ ព័ត៌មាននេះមើលទៅមានលក្ខណៈវិជ្ជាជីវៈ។ ទោះជាយ៉ាងណា សូមពិនិត្យជាមួយសារព័ត៌មានផ្លូវការផ្សេងទៀត។", style: "bg-green-100 text-green-800" },
                { text: "លទ្ធផល៖ ការវិភាគមិនអាចកំណត់បានច្បាស់។ អត្ថបទនេះមានពាក្យពេចន៍ញុះញង់ ដែលជាសញ្ញានៃព័ត៌មានក្លែងក្លាយ។", style: "bg-yellow-100 text-yellow-800" }
            ];
            
            const randomResponse = responses[Math.floor(Math.random() * responses.length)];
            
            resultDiv.className = `mt-3 font-semibold p-3 rounded ${randomResponse.style}`;
            resultDiv.innerText = randomResponse.text;
            resultDiv.classList.remove('hidden');
        }

        function checkImage() {
            const input = document.getElementById('imageInput');
            const resultDiv = document.getElementById('imageResult');
            
            if (input.files.length === 0) {
                alert("សូមជ្រើសរើសរូបភាពជាមុនសិន!");
                return;
            }

            // បង្កើតលទ្ធផលរូបភាពដោយចៃដន្យ
            const imgResponses = [
                { text: "លទ្ធផល៖ រូបភាពនេះមានសញ្ញាណនៃរូបភាពកែច្នៃដោយ AI (ដូចជាផ្ទៃមុខរលោងខ្លាំង)។", style: "bg-red-100 text-red-800" },
                { text: "លទ្ធផល៖ មិនឃើញមានសញ្ញាណនៃរូបភាព AI ទេ។ វាអាចជារូបភាពពិតប្រាកដ។", style: "bg-blue-100 text-blue-800" }
            ];

            const randomImg = imgResponses[Math.floor(Math.random() * imgResponses.length)];
            
            resultDiv.className = `mt-3 font-semibold p-3 rounded ${randomImg.style}`;
            resultDiv.innerText = randomImg.text;
            resultDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
