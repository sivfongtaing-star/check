<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធវិភាគព័ត៌មាន និងរូបភាព AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Moul&display=swap');
        body {
            font-family: 'Battambang', sans-serif;
            background-color: #f3f4f6;
        }
        .title-font {
            font-family: 'Moul', serif;
        }
        .loader {
            border-top-color: #3b82f6;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Custom scrollbar for result box */
        .result-content::-webkit-scrollbar {
            width: 8px;
        }
        .result-content::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        .result-content::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .result-content::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="min-h-screen text-gray-800">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-6">
            <div class="flex items-center justify-center space-x-4">
                <i class="fas fa-shield-halved text-4xl"></i>
                <div>
                    <h1 class="text-2xl md:text-3xl title-font text-center">ប្រព័ន្ធផ្ទៀងផ្ទាត់ព័ត៌មាន និងរូបភាព</h1>
                    <p class="text-blue-200 text-sm md:text-base text-center mt-2">ឧបករណ៍ជំនួយអប់រំសម្រាប់បែងចែកព័ត៌មានក្លែងក្លាយ និងរូបភាព AI</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 max-w-4xl">
        
        <!-- Tab Navigation -->
        <div class="flex border-b border-gray-300 mb-6 bg-white rounded-t-lg overflow-hidden shadow-sm">
            <button onclick="switchTab('text')" id="tab-text" class="flex-1 py-4 text-center font-bold text-blue-600 bg-blue-50 border-b-2 border-blue-600 transition duration-300">
                <i class="fas fa-file-lines mr-2"></i> វិភាគអត្ថបទព័ត៌មាន
            </button>
            <button onclick="switchTab('image')" id="tab-image" class="flex-1 py-4 text-center font-bold text-gray-500 hover:bg-gray-50 transition duration-300">
                <i class="fas fa-image mr-2"></i> វិភាគរូបភាព
            </button>
        </div>

        <!-- Content Areas -->
        <div class="bg-white rounded-b-lg shadow-md p-6">
            
            <!-- Text Analysis Section -->
            <div id="section-text" class="block">
                <label for="newsInput" class="block text-gray-700 font-bold mb-2">សូមបញ្ចូលអត្ថបទព័ត៌មាន ឬតំណរភ្ជាប់ (Link) ដែលអ្នកសង្ស័យទីនេះ៖</label>
                <textarea id="newsInput" rows="6" class="w-full p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" placeholder="ឧទាហរណ៍៖ មានការចែករំលែកថា ការផឹកទឹកក្តៅលាយក្រូចឆ្មាអាចព្យាបាលជំងឺគ្រប់ប្រភេទ..."></textarea>
                
                <button onclick="analyzeText()" id="btn-analyze-text" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 flex justify-center items-center">
                    <i class="fas fa-search mr-2"></i> ចាប់ផ្តើមវិភាគអត្ថបទ
                </button>
            </div>

            <!-- Image Analysis Section -->
            <div id="section-image" class="hidden">
                <label class="block text-gray-700 font-bold mb-2">សូមបង្ហោះរូបភាពដែលអ្នកចង់ត្រួតពិនិត្យ៖</label>
                
                <div class="flex items-center justify-center w-full mt-2">
                    <label for="imageInput" class="flex flex-col items-center justify-center w-full h-64 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 transition">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6" id="upload-prompt">
                            <i class="fas fa-cloud-arrow-up text-4xl text-gray-400 mb-3"></i>
                            <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">ចុចទីនេះដើម្បីបង្ហោះ</span> ឬទាញទម្លាក់រូបភាព (Drag & Drop)</p>
                            <p class="text-xs text-gray-500">គាំទ្រឯកសារ: PNG, JPG, JPEG</p>
                        </div>
                        <img id="imagePreview" src="" alt="Image Preview" class="hidden max-h-60 rounded-lg object-contain p-2">
                    </label>
                    <input id="imageInput" type="file" class="hidden" accept="image/png, image/jpeg, image/jpg" onchange="previewImage(event)" />
                </div>
                
                <button onclick="analyzeImage()" id="btn-analyze-image" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 flex justify-center items-center disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <i class="fas fa-robot mr-2"></i> ចាប់ផ្តើមវិភាគរូបភាព
                </button>
            </div>

            <!-- Loading Indicator -->
            <div id="loading" class="hidden mt-8 flex flex-col items-center justify-center">
                <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
                <p class="text-blue-600 font-semibold animate-pulse">ប្រព័ន្ធកំពុងធ្វើការវិភាគ សូមរង់ចាំបន្តិច...</p>
            </div>

            <!-- Result Section -->
            <div id="resultBox" class="hidden mt-8 border rounded-lg overflow-hidden shadow-sm">
                <div id="resultHeader" class="bg-gray-100 px-4 py-3 border-b flex justify-between items-center">
                    <h3 class="font-bold text-gray-800"><i class="fas fa-clipboard-check text-green-600 mr-2"></i> លទ្ធផលនៃការវិភាគ</h3>
                    <button onclick="closeResult()" class="text-gray-500 hover:text-red-500"><i class="fas fa-times"></i></button>
                </div>
                <div id="resultContent" class="p-6 bg-white text-gray-700 leading-relaxed result-content max-h-96 overflow-y-auto whitespace-pre-line">
                    <!-- Result will appear here -->
                </div>
            </div>

        </div>
    </main>

    <footer class="text-center text-gray-500 text-sm mt-8 pb-8">
        <p>បង្កើតឡើងសម្រាប់គោលបំណងអប់រំនៅប្រទេសកម្ពុជា &copy; 2026</p>
    </footer>

    <script>
        // API Key given by the execution environment
        const apiKey = ""; 

        // State variables
        let currentTab = 'text';
        let base64ImageData = null;
        let imageMimeType = null;

        // UI Functions
        function switchTab(tab) {
            currentTab = tab;
            
            // Tab styling
            document.getElementById('tab-text').className = tab === 'text' 
                ? 'flex-1 py-4 text-center font-bold text-blue-600 bg-blue-50 border-b-2 border-blue-600 transition duration-300' 
                : 'flex-1 py-4 text-center font-bold text-gray-500 hover:bg-gray-50 transition duration-300 border-b border-transparent';
            
            document.getElementById('tab-image').className = tab === 'image' 
                ? 'flex-1 py-4 text-center font-bold text-blue-600 bg-blue-50 border-b-2 border-blue-600 transition duration-300' 
                : 'flex-1 py-4 text-center font-bold text-gray-500 hover:bg-gray-50 transition duration-300 border-b border-transparent';

            // Section visibility
            document.getElementById('section-text').style.display = tab === 'text' ? 'block' : 'none';
            document.getElementById('section-image').style.display = tab === 'image' ? 'block' : 'none';
            
            // Hide result and loading when switching tabs
            document.getElementById('resultBox').classList.add('hidden');
            document.getElementById('loading').classList.add('hidden');
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imgPreview = document.getElementById('imagePreview');
                const uploadPrompt = document.getElementById('upload-prompt');
                const btnAnalyze = document.getElementById('btn-analyze-image');

                imgPreview.src = e.target.result;
                imgPreview.classList.remove('hidden');
                uploadPrompt.classList.add('hidden');
                
                // Extract base64 data and mime type
                const resultStr = e.target.result;
                imageMimeType = resultStr.split(';')[0].split(':')[1];
                base64ImageData = resultStr.split(',')[1];

                btnAnalyze.disabled = false;
            }
            reader.readAsDataURL(file);
        }

        function closeResult() {
            document.getElementById('resultBox').classList.add('hidden');
        }

        function showLoading() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('resultBox').classList.add('hidden');
            document.getElementById('btn-analyze-text').disabled = true;
            document.getElementById('btn-analyze-image').disabled = true;
        }

        function hideLoading() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('btn-analyze-text').disabled = false;
            document.getElementById('btn-analyze-image').disabled = false;
        }

        function displayResult(text) {
            const resultBox = document.getElementById('resultBox');
            const resultContent = document.getElementById('resultContent');
            const resultHeader = document.getElementById('resultHeader');

            // Simple formatting: make **text** bold
            const formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong class="text-blue-800">$1</strong>');
            
            resultContent.innerHTML = formattedText;
            resultBox.classList.remove('hidden');

            // Determine if it looks highly fake or real based on keywords (simple heuristic for UI color)
            if(text.includes('ក្លែងក្លាយ') || text.includes('បង្កើតដោយ AI') || text.includes('សង្ស័យ')) {
                resultHeader.className = "bg-red-50 px-4 py-3 border-b border-red-200 flex justify-between items-center";
                resultHeader.querySelector('h3').innerHTML = '<i class="fas fa-exclamation-circle text-red-600 mr-2"></i> រកឃើញចំណុចសង្ស័យ';
            } else {
                resultHeader.className = "bg-green-50 px-4 py-3 border-b border-green-200 flex justify-between items-center";
                resultHeader.querySelector('h3').innerHTML = '<i class="fas fa-check-circle text-green-600 mr-2"></i> លទ្ធផលនៃការវិភាគ';
            }
        }

        function showError(message) {
            const resultContent = document.getElementById('resultContent');
            const resultBox = document.getElementById('resultBox');
            const resultHeader = document.getElementById('resultHeader');

            resultHeader.className = "bg-red-100 px-4 py-3 border-b border-red-300 flex justify-between items-center";
            resultHeader.querySelector('h3').innerHTML = '<i class="fas fa-times-circle text-red-600 mr-2"></i> មានបញ្ហា';
            resultContent.innerHTML = `<p class="text-red-600">${message}</p>`;
            resultBox.classList.remove('hidden');
        }

        // Gemini API Implementation with Exponential Backoff
        async function fetchGeminiAPI(payload) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const maxRetries = 5;
            const delays = [1000, 2000, 4000, 8000, 16000];

            for (let i = 0; i <= maxRetries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "មិនអាចទាញយកការវិភាគបានទេ។";
                } catch (error) {
                    if (i === maxRetries) {
                        console.error("API Call Failed after retries:", error);
                        throw new Error("ប្រព័ន្ធមិនអាចដំណើរការបានទេពេលនេះ សូមព្យាយាមម្តងទៀតនៅពេលក្រោយ។");
                    }
                    // Wait before retrying (Exponential Backoff)
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        }

        // Text Analysis Logic
        async function analyzeText() {
            const textInput = document.getElementById('newsInput').value.trim();
            if (!textInput) {
                alert("សូមបញ្ចូលអត្ថបទព័ត៌មានជាមុនសិន!");
                return;
            }

            showLoading();

            const prompt = `អ្នកគឺជាអ្នកជំនាញផ្ទៀងផ្ទាត់ព័ត៌មាន (Fact-checker) ដ៏ពូកែមួយរូប។ 
សូមជួយវិភាគអត្ថបទខាងក្រោមនេះ ថាតើវាទំនងជាព័ត៌មានពិត (Real News) ឬ ព័ត៌មានក្លែងក្លាយ (Fake News/Misinformation)។ 
សូមរៀបរាប់ជាភាសាខ្មែរឱ្យបានច្បាស់លាស់ ដោយបែងចែកជាចំណុចៗដូចជា៖
១. ការវាយតម្លៃរួម (តើទំនងជាពិត ឬក្លែងក្លាយ)
២. ចំណុចគួរឱ្យសង្ស័យ (ឧ. ការប្រើភាសាញុះញង់, គ្មានប្រភពច្បាស់លាស់, ការសន្យាហួសហេតុ)
៣. ដំបូន្មាន (តើអ្នកអានគួរធ្វើយ៉ាងណាដើម្បីផ្ទៀងផ្ទាត់បន្ថែម)

អត្ថបទ៖ "${textInput}"`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: {
                    parts: [{ text: "ឆ្លើយតបជាភាសាខ្មែរប្រកបដោយវិជ្ជាជីវៈ និងងាយយល់សម្រាប់សិស្សានុសិស្ស។" }]
                }
            };

            try {
                const resultText = await fetchGeminiAPI(payload);
                displayResult(resultText);
            } catch (error) {
                showError(error.message);
            } finally {
                hideLoading();
            }
        }

        // Image Analysis Logic
        async function analyzeImage() {
            if (!base64ImageData) {
                alert("សូមបង្ហោះរូបភាពជាមុនសិន!");
                return;
            }

            showLoading();

            const prompt = `អ្នកគឺជាអ្នកជំនាញខាងស៊ើបអង្កេតរូបភាពឌីជីថល។ 
សូមពិនិត្យមើលរូបភាពនេះយ៉ាងល្អិតល្អន់ ហើយប្រាប់ថាតើវាជារូបភាពពិតប្រាកដ ឬជារូបភាពដែលបង្កើតឡើងដោយបញ្ញាសិប្បនិម្មិត (AI Generated Image)?
សូមពន្យល់ជាភាសាខ្មែរ ដោយផ្តោតលើចំណុចដូចជា៖
១. ការសន្និដ្ឋានរួម
២. ចំណុចសម្គាល់ (ឧ. ទម្រង់ម្រាមដៃ, ផ្ទៃខាងក្រោយរញ៉េរញ៉ៃ, ពន្លឺស្រមោលមិនសមហេតុផល, អក្សរមិនច្បាស់លាស់)
៣. ភាគរយដែលអ្នកជឿជាក់។`;

            const payload = {
                contents: [
                    { 
                        role: "user", 
                        parts: [
                            { text: prompt }, 
                            { inlineData: { mimeType: imageMimeType, data: base64ImageData } }
                        ] 
                    }
                ],
                systemInstruction: {
                    parts: [{ text: "ឆ្លើយតបជាភាសាខ្មែរប្រកបដោយវិជ្ជាជីវៈ និងផ្តល់ហេតុផលច្បាស់លាស់។" }]
                }
            };

            try {
                const resultText = await fetchGeminiAPI(payload);
                displayResult(resultText);
            } catch (error) {
                showError(error.message);
            } finally {
                hideLoading();
            }
        }
    </script>
</body>
</html>
