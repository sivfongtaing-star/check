<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>កម្មវិធីត្រួតពិនិត្យព័ត៌មាន និងរូបភាព</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.451.0"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4">
    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <h1 class="text-2xl font-bold text-slate-800 mb-6">កម្មវិធីត្រួតពិនិត្យព័ត៌មាន និងរូបភាព</h1>
        
        <!-- ផ្នែកវិភាគអត្ថបទ -->
        <div class="space-y-4 mb-8">
            <h2 class="font-semibold text-slate-700">វិភាគអត្ថបទ៖</h2>
            <textarea id="text-input" class="w-full h-24 p-3 border rounded-lg" placeholder="វាយអត្ថបទព័ត៌មាន..."></textarea>
            <button onclick="analyzeText()" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">វិភាគអត្ថបទ</button>
        </div>

        <!-- ផ្នែកវិភាគរូបភាព -->
        <div class="space-y-4 border-t pt-6">
            <h2 class="font-semibold text-slate-700">វិភាគរូបភាព៖</h2>
            <input type="file" id="image-input" accept="image/*" class="w-full p-2 border rounded-lg">
            <button onclick="analyzeImage()" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700">វិភាគរូបភាព</button>
        </div>

        <div id="loader" class="hidden text-center text-blue-600 mt-4">កំពុងដំណើរការ...</div>
        <div id="result" class="hidden mt-6 p-4 bg-slate-100 rounded-lg whitespace-pre-line text-sm leading-relaxed"></div>
    </div>

    <script>
        const apiKey = ""; 

        // មុខងារវិភាគអត្ថបទ
        async function analyzeText() {
            const text = document.getElementById('text-input').value;
            if(!text) return;
            showLoading(true);

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `វិភាគព័ត៌មាននេះ៖ ${text}` }] }],
                        systemInstruction: { parts: [{ text: "អ្នកគឺជាអ្នកត្រួតពិនិត្យព័ត៌មាន។ ឆ្លើយតបដោយសង្ខេប៖ ស្ថានភាព, ការវិភាគ, និងកម្រិតទំនុកចិត្ត ដោយមិនប្រើសញ្ញា '{', '}' ឬសញ្ញាផ្កាយ '*' ឡើយ។" }] }
                    })
                });
                const data = await response.json();
                let rawText = data.candidates[0].content.parts[0].text;
                
                // លុបសញ្ញាផ្កាយ (*) និងសញ្ញាទ្រង់ទ្រាយផ្សេងៗដែលនៅសេសសល់
                let cleanText = rawText.replace(/[*]/g, '');
                
                document.getElementById('result').innerText = cleanText.trim();
                document.getElementById('result').classList.remove('hidden');
            } catch(e) { alert("មានកំហុស"); } finally { showLoading(false); }
        }

        // មុខងារវិភាគរូបភាព
        async function analyzeImage() {
            const fileInput = document.getElementById('image-input');
            if(fileInput.files.length === 0) return alert("សូមជ្រើសរើសរូបភាពសិន");
            
            showLoading(true);
            const file = fileInput.files[0];
            const reader = new FileReader();
            
            reader.onloadend = async () => {
                const base64Image = reader.result.split(',')[1];
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [
                                { text: "តើរូបភាពនេះជាការកាត់ត ឬរូបភាព AI មែនទេ? ឆ្លើយតបដោយសង្ខេប៖ ស្ថានភាព, ការវិភាគ, និងកម្រិតទំនុកចិត្ត ដោយមិនប្រើសញ្ញា '{', '}' ឬសញ្ញាផ្កាយ '*' ឡើយ។" },
                                { inlineData: { mimeType: file.type, data: base64Image } }
                            ] }]
                        })
                    });
                    const data = await response.json();
                    let rawText = data.candidates[0].content.parts[0].text;
                    
                    // លុបសញ្ញាផ្កាយ (*) និងសញ្ញាទ្រង់ទ្រាយផ្សេងៗដែលនៅសេសសល់
                    let cleanText = rawText.replace(/[*]/g, '');

                    document.getElementById('result').innerText = cleanText.trim();
                    document.getElementById('result').classList.remove('hidden');
                } catch(e) { alert("មានកំហុសក្នុងការវិភាគរូបភាព"); } finally { showLoading(false); }
            };
            reader.readAsDataURL(file);
        }

        function showLoading(show) {
            document.getElementById('loader').classList.toggle('hidden', !show);
        }
    </script>
</body>
</html>
