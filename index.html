<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធផ្ទៀងផ្ទាត់ព័ត៌មាននិងរូបភាព</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-4 text-blue-800">ប្រព័ន្ធផ្ទៀងផ្ទាត់ព័ត៌មាន និងរូបភាព</h1>
        <p class="mb-4">សូមដាក់បញ្ចូលព័ត៌មាន ឬរូបភាពដើម្បីពិនិត្យផ្ទៀងផ្ទាត់៖</p>

        <!-- ផ្នែកពិនិត្យព័ត៌មាន -->
        <div class="mb-6">
            <textarea id="newsInput" class="w-full p-3 border rounded" rows="4" placeholder="ចម្លងអត្ថបទព័ត៌មានមកទីនេះ..."></textarea>
            <button onclick="checkNews()" class="mt-2 bg-blue-600 text-white px-4 py-2 rounded">ពិនិត្យព័ត៌មាន</button>
            <div id="newsResult" class="mt-3 font-semibold"></div>
        </div>

        <hr class="my-6">

        <!-- ផ្នែកពិនិត្យរូបភាព -->
        <div>
            <label class="block mb-2">ដាក់រូបភាព (Upload Image):</label>
            <input type="file" id="imageInput" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-blue-50 file:text-blue-700">
            <button onclick="checkImage()" class="mt-2 bg-green-600 text-white px-4 py-2 rounded">ពិនិត្យរូបភាព</button>
            <div id="imageResult" class="mt-3 font-semibold"></div>
        </div>
    </div>

    <script>
        // មុខងារពិនិត្យព័ត៌មាន (គំរូដើម)
        function checkNews() {
            const input = document.getElementById('newsInput').value;
            const resultDiv = document.getElementById('newsResult');
            if (!input) {
                resultDiv.innerText = "សូមបញ្ចូលអត្ថបទជាមុនសិន។";
                return;
            }
            // នេះជាតក្កវិជ្ជាសាមញ្ញសម្រាប់បង្ហាញលទ្ធផល
            resultDiv.innerText = "កំពុងវិភាគ... ព័ត៌មាននេះមើលទៅហាក់ដូចជាមានភាពមិនច្បាស់លាស់។ សូមពិនិត្យប្រភពដើមបន្ថែម។";
            resultDiv.className = "mt-3 font-semibold text-yellow-600";
        }

        // មុខងារពិនិត្យរូបភាព (គំរូដើម)
        function checkImage() {
            const input = document.getElementById('imageInput');
            const resultDiv = document.getElementById('imageResult');
            if (input.files.length === 0) {
                resultDiv.innerText = "សូមជ្រើសរើសរូបភាពជាមុនសិន។";
                return;
            }
            resultDiv.innerText = "កំពុងវិភាគរូបភាព... គំរូនៃរូបភាពនេះមានលក្ខណៈដូចជាផលិតដោយ AI (AI-Generated Image)។";
            resultDiv.className = "mt-3 font-semibold text-red-600";
        }
    </script>
</body>
</html>
