<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធផ្ទៀងផ្ទាត់ព័ត៌មាននិងរូបភាព</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-4 text-blue-800">ប្រព័ន្ធផ្ទៀងផ្ទាត់ព័ត៌មាន និងរូបភាព</h1>
        
        <!-- ផ្នែកព័ត៌មាន -->
        <div class="mb-6">
            <label class="block font-bold mb-2">១. ពិនិត្យភាពគួរឱ្យទុកចិត្តនៃព័ត៌មាន៖</label>
            <textarea id="newsInput" class="w-full p-3 border rounded" rows="4" placeholder="ចម្លងអត្ថបទព័ត៌មានមកទីនេះ..."></textarea>
            <p class="text-sm text-gray-600 mt-2">សំណួរជួយគិត៖ តើព័ត៌មាននេះមានប្រភពច្បាស់លាស់ដែរឬទេ? តើវាមានកំហុសអក្ខរាវិរុទ្ធច្រើនទេ?</p>
            <button onclick="checkNews()" class="mt-3 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">ពិនិត្យព័ត៌មាន</button>
            <div id="newsResult" class="mt-3 font-semibold p-3 rounded hidden"></div>
        </div>

        <hr class="my-6">

        <!-- ផ្នែករូបភាព -->
        <div>
            <label class="block font-bold mb-2">២. ពិនិត្យភាពពិតប្រាកដនៃរូបភាព៖</label>
            <input type="file" id="imageInput" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-blue-50 file:text-blue-700">
            <p class="text-sm text-gray-600 mt-2">ចំណុចត្រូវពិនិត្យ៖ តើម្រាមដៃមនុស្សធម្មតាទេ? តើផ្ទៃខាងក្រោយមានភាពព្រាលខុសធម្មតាទេ?</p>
            <button onclick="checkImage()" class="mt-3 bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">ពិនិត្យរូបភាព</button>
            <div id="imageResult" class="mt-3 font-semibold p-3 rounded hidden"></div>
        </div>
    </div>

    <script>
        function checkNews() {
            const input = document.getElementById('newsInput').value;
            const resultDiv = document.getElementById('newsResult');
            
            if (!input) {
                alert("សូមបញ្ចូលអត្ថបទព័ត៌មានជាមុនសិន!");
                return;
            }

            // កែសម្រួល៖ បង្ហាញលទ្ធផលដោយផ្អែកលើការវិភាគសាមញ្ញ
            resultDiv.classList.remove('hidden', 'bg-yellow-100', 'text-yellow-800', 'bg-green-100', 'text-green-800');
            
            if (input.length < 50) {
                resultDiv.innerText = "លទ្ធផល៖ ព័ត៌មានខ្លីពេកក្នុងការវិភាគ។ សូមពិនិត្យមើលថាតើវាមានប្រភពយោងត្រឹមត្រូវដែរឬទេ?";
                resultDiv.classList.add('bg-yellow-100', 'text-yellow-800');
            } else {
                resultDiv.innerText = "លទ្ធផល៖ ការវិភាគបឋម៖ សូមកុំទាន់ជឿជាក់ ១០០%! សូមព្យាយាមស្វែងរកព័ត៌មាននេះនៅលើ Google News ឬគេហទំព័រផ្លូវការរបស់រដ្ឋាភិបាល។";
                resultDiv.classList.add('bg-green-100', 'text-green-800');
            }
        }

        function checkImage() {
            const input = document.getElementById('imageInput');
            const resultDiv = document.getElementById('imageResult');
            
            if (input.files.length === 0) {
                alert("សូមជ្រើសរើសរូបភាពជាមុនសិន!");
                return;
            }

            resultDiv.classList.remove('hidden', 'bg-red-100', 'text-red-800', 'bg-blue-100', 'text-blue-800');
            resultDiv.innerText = "លទ្ធផល៖ កំពុងពិនិត្យផ្ទៃខាងក្រោយ និងលក្ខណៈរូបភាព... ចំណាំ៖ រូបភាពដែលបង្កើតដោយ AI តែងតែមានភាពរលោងពេក ឬមានកំហុសលើផ្នែកតូចៗ (ដូចជាម្រាមដៃ ឬគ្រឿងអលង្ការ)។ សូមពិនិត្យដោយប្រុងប្រយ័ត្ន។";
            resultDiv.classList.add('bg-blue-100', 'text-blue-800');
        }
    </script>
</body>
</html>
