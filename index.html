<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>កម្មវិធីត្រួតពិនិត្យព័ត៌មាន និងរូបភាព</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&family=Moul&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; }
        .khmer-moul { font-family: 'Moul', cursive; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col">

    <header class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white shadow-md">
        <div class="max-w-3xl mx-auto px-4 py-5 flex items-center gap-3">
            <div class="bg-white/10 p-2.5 rounded-xl border border-white/20">
                <i data-lucide="shield-check" class="w-8 h-8 text-emerald-400"></i>
            </div>
            <div>
                <h1 class="khmer-moul text-lg md:text-xl text-yellow-300">ប្រព័ន្ធត្រួតពិនិត្យ និងវាយតម្លៃព័ត៌មាន</h1>
                <p class="text-xs text-slate-200">ជំនួយការបង្រៀន និងស្វែងរកការពិតដោយបច្ចេកវិទ្យា AI</p>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-3xl w-full mx-auto p-4 md:py-8 space-y-6">
        <div class="bg-white p-1 rounded-xl shadow-sm border border-slate-200 flex">
            <button onclick="switchTab('text')" id="tab-btn-text" class="flex-1 py-2.5 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 transition duration-150 bg-blue-600 text-white">
                <i data-lucide="file-text" class="w-4 h-4"></i> វិភាគអត្ថបទ
            </button>
            <button onclick="switchTab('image')" id="tab-btn-image" class="flex-1 py-2.5 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 transition duration-150 text-slate-600 hover:text-slate-800">
                <i data-lucide="image" class="w-4 h-4"></i> វិភាគរូបភាព
            </button>
        </div>

        <div id="tab-text" class="space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <textarea id="text-input" class="w-full h-32 p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 transition duration-150 text-sm" placeholder="ដាក់ខ្លឹមសារព័ត៌មានមកទីនេះ..."></textarea>
                <button onclick="analyzeText()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition duration-150 shadow">ចាប់ផ្តើមវិភាគអត្ថបទ</button>
            </div>
        </div>

        <div id="tab-image" class="hidden space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <input type="file" id="image-input" accept="image/*" class="hidden" onchange="previewSelectedImage(event)">
                <div onclick="document.getElementById('image-input').click()" class="border-2 border-dashed border-slate-300 rounded-xl p-6 bg-slate-50 cursor-pointer text-center">
                    <p class="text-sm">ចុចដើម្បីជ្រើសរើសរូបភាព</p>
                    <img id="preview-img" src="#" alt="Preview" class="hidden max-h-48 mx-auto mt-4 rounded-lg">
                </div>
                <button onclick="analyzeImage()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition duration-150 shadow">ចាប់ផ្តើមវិភាគរូបភាព</button>
            </div>
        </div>

        <div id="loader" class="hidden text-center py-4"><div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent"></div></div>
        <div id="error-card" class="hidden bg-rose-50 border border-rose-200 p-4 rounded-xl text-rose-800 text-sm"></div>
        <div id="result-card" class="hidden bg-white p-5 rounded-2xl shadow-sm border border-slate-200 text-sm text-slate-700 whitespace-pre-line"></div>
    </main>

    <script>
        // API Key បានអាប់ដេតថ្មីតាមសំណើរបស់លោកគ្រូ
        const apiKey = "AQ.Ab8RN6KHbchdDIJzmFXtv8G9HKWEyqTR9C2Brb0IPmwA4DnILw"; 
        
        lucide.createIcons();

        function switchTab(tab) {
            document.getElementById('tab-text').classList.toggle('hidden', tab !== 'text');
            document.getElementById('tab-image').classList.toggle('hidden', tab !== 'image');
        }

        async function callGeminiAPI(payload) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error?.message || "កំហុសក្នុងការតភ្ជាប់");
            return data;
        }

        async function analyzeText() {
            const text = document.getElementById('text-input').value;
            if(!text) return alert("សូមបញ្ចូលអត្ថបទ");
            
            showLoading(true);
            try {
                const data = await callGeminiAPI({
                    contents: [{ parts: [{ text: "វិភាគព័ត៌មាននេះជាភាសាខ្មែរ៖ " + text }] }]
                });
                showResult(data.candidates[0].content.parts[0].text);
            } catch (e) {
                showError(e.message);
            } finally {
                showLoading(false);
            }
        }

        function showLoading(show) { document.getElementById('loader').classList.toggle('hidden', !show); }
        function showError(msg) { 
            const e = document.getElementById('error-card');
            e.innerText = msg; e.classList.remove('hidden'); 
        }
        function showResult(text) {
            const r = document.getElementById('result-card');
            r.innerText = text; r.classList.remove('hidden');
        }
    </script>
</body>
</html>
