<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>ប្រព័ន្ធវិភាគ AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-6 bg-gray-100">
    <div class="max-w-xl mx-auto bg-white p-6 rounded shadow space-y-8">
        
        <!-- ការកំណត់ API Key -->
        <div>
            <h2 class="text-xl font-bold mb-4">១. ការកំណត់ API Key</h2>
            <input type="password" id="apiKeyInput" placeholder="បញ្ចូល AIza... នៅទីនេះ" class="w-full p-2 border mb-4">
            <button id="saveKeyBtn" class="bg-green-600 text-white px-4 py-2 rounded w-full">រក្សាទុក Key</button>
        </div>

        <hr>

        <!-- ផ្នែកវិភាគអត្ថបទ -->
        <div>
            <h2 class="text-xl font-bold mb-4">២. វិភាគអត្ថបទព័ត៌មាន</h2>
            <textarea id="textInput" class="w-full p-2 border mb-4" rows="4" placeholder="បញ្ចូលអត្ថបទព័ត៌មាននៅទីនេះ..."></textarea>
            <button id="scanTextBtn" class="bg-blue-600 text-white px-4 py-2 rounded w-full">វិភាគអត្ថបទ</button>
        </div>

        <hr>

        <!-- ផ្នែកវិភាគរូបភាព -->
        <div>
            <h2 class="text-xl font-bold mb-4">៣. វិភាគរូបភាព</h2>
            <input type="file" id="imageInput" class="mb-4">
            <button id="scanBtn" class="bg-indigo-600 text-white px-4 py-2 rounded w-full">វិភាគរូបភាព</button>
        </div>

        <div id="status" class="mt-4 p-4 bg-gray-50 border rounded font-bold whitespace-pre-wrap text-sm"></div>
    </div>

    <script>
        document.getElementById('saveKeyBtn').addEventListener('click', () => {
            localStorage.setItem('gemini_key', document.getElementById('apiKeyInput').value);
            alert("រក្សាទុក Key រួចរាល់!");
        });

        // មុខងារជំនួយក្នុងការហៅ API
        async function callGemini(payload, isImage = false) {
            const key = localStorage.getItem('gemini_key');
            if(!key) throw new Error("សូមបញ្ចូល API Key ក្នុងប្រអប់ខាងលើ!");

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || "មានកំហុសក្នុងការតភ្ជាប់ទៅកាន់ Google AI");
            }

            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        }

        // មុខងារវិភាគអត្ថបទ
        document.getElementById('scanTextBtn').addEventListener('click', async () => {
            const text = document.getElementById('textInput').value;
            if(!text) return alert("សូមបញ្ចូលអត្ថបទ!");

            document.getElementById('status').innerText = "កំពុងវិភាគអត្ថបទ...";
            try {
                const result = await callGemini({ contents: [{ parts: [{ text: "សូមវិភាគថាអត្ថបទនេះជាព័ត៌មានពិត ឬព័ត៌មានមិនពិត ហើយពន្យល់ហេតុផលជាភាសាខ្មែរ៖ " + text }] }] });
                document.getElementById('status').innerText = result;
            } catch (err) {
                document.getElementById('status').innerText = "កំហុស៖ " + err.message;
            }
        });

        // មុខងារវិភាគរូបភាព
        document.getElementById('scanBtn').addEventListener('click', async () => {
            const file = document.getElementById('imageInput').files[0];
            if(!file) return alert("សូមជ្រើសរើសរូបភាព!");

            document.getElementById('status').innerText = "កំពុងវិភាគរូបភាព...";

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const base64 = e.target.result.split(',')[1];
                    const result = await callGemini({ 
                        contents: [{ parts: [
                            { text: "សូមវិភាគរូបភាពនេះជាភាសាខ្មែរ៖ តើវាជារូបពិត ឬរូប AI?" }, 
                            { inlineData: { mimeType: file.type, data: base64 } }
                        ] }] 
                    });
                    document.getElementById('status').innerText = result;
                } catch (err) {
                    document.getElementById('status').innerText = "កំហុស៖ " + err.message;
                }
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
